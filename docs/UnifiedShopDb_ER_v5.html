  const tc=document.createElement('div');tc.className='tc';
  const MAX=7;

    const b=c.pk?'<span class="bpk">PK</span>':(c.fk?'<span class="bfk">FK</span>':'');
    r.innerHTML=b+`<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${c.n}</span><span style="font-size:9px;color:#4c5899;flex-shrink:0;margin-left:4px">${c.t.split('(')[0]}</span>`;
    tc.appendChild(r);
  });
  if(t.c.length>MAX){const m=document.createElement('div');m.className='cm';m.textContent=`+${t.c.length-MAX} more`;tc.appendChild(m);}
  d.appendChild(tc);
  d.addEventListener('click',e=>{e.stopPropagation();selectT(t.n);});
  cw.appendChild(d);
}
T.forEach(buildNode);

function scCoord(name){
  const p=pos[name];if(!p)return null;
  const el=document.getElementById('t-'+name);if(!el)return null;
  const w=el.offsetWidth||200,h=el.offsetHeight||120;
  return{x:p.x*sc+tx+w*sc/2,y:p.y*sc+ty+h*sc/2,w:w*sc,h:h*sc};
}
function drawRels(filter){
  sv.innerHTML='';if(!showR)return;
  RELS.forEach(r=>{
    if(filter&&r.from!==filter&&r.to!==filter)return;
    const a=scCoord(r.from),b=scCoord(r.to);if(!a||!b)return;
    const dx=b.x-a.x,cx1=a.x+dx*.5,cy1=a.y,cx2=b.x-dx*.5,cy2=b.y;
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d',`M${a.x},${a.y} C${cx1},${cy1} ${cx2},${cy2} ${b.x},${b.y}`);
    path.setAttribute('stroke',filter?'#7c8cf8':'#2d3352');
    path.setAttribute('stroke-width',filter?'1.5':'0.8');
    path.setAttribute('fill','none');
    path.setAttribute('opacity',filter?'0.9':'0.4');
    sv.appendChild(path);
  });
}
function applyT(){
  document.querySelectorAll('.tn').forEach(n=>{
    const p=pos[n.dataset.t];
    n.style.transform=`translate(${p.x*sc+tx}px,${p.y*sc+ty}px) scale(${sc})`;
    n.style.left='0';n.style.top='0';n.style.transformOrigin='0 0';
  });
  sv.setAttribute('viewBox',`0 0 ${cw.offsetWidth} ${cw.offsetHeight}`);
  drawRels(sel);updateMM();
}
function resetView(){sc=0.25;tx=50;ty=40;applyT();}
function zoomIn(){sc=Math.min(sc*1.2,2);applyT();}
function zoomOut(){sc=Math.max(sc/1.2,0.07);applyT();}
cw.addEventListener('mousedown',e=>{if(e.target.closest('.tn'))return;drag=true;lx=e.clientX;ly=e.clientY;cw.classList.add('dr');});
window.addEventListener('mousemove',e=>{if(!drag)return;tx+=e.clientX-lx;ty+=e.clientY-ly;lx=e.clientX;ly=e.clientY;applyT();});
window.addEventListener('mouseup',()=>{drag=false;cw.classList.remove('dr');});
cw.addEventListener('wheel',e=>{e.preventDefault();sc=Math.min(Math.max(sc*(e.deltaY<0?1.1:.9),.07),2);applyT();},{passive:false});
function selectT(name){
  const related=new Set([name]);
  RELS.forEach(r=>{if(r.from===name)related.add(r.to);if(r.to===name)related.add(r.from);});
  document.querySelectorAll('.tn').forEach(n=>{
    n.classList.remove('sel','hi','dim');
    if(n.dataset.t===name)n.classList.add('sel');
    else if(related.has(n.dataset.t))n.classList.add('hi');
    else n.classList.add('dim');
  });
  sel=name;drawRels(name);showDP(name);
}
document.addEventListener('click',e=>{
  if(!e.target.closest('.tn')&&!e.target.closest('#dp')){
    document.querySelectorAll('.tn').forEach(n=>n.classList.remove('sel','hi','dim'));
    sel=null;closeDP();drawRels(null);
  }
});
function showDP(name){
  const t=T.find(x=>x.n===name);if(!t)return;
  document.getElementById('dpt').textContent=name;
  const dc=document.getElementById('dpc');dc.innerHTML='';
  t.c.forEach(c=>{
    const d=document.createElement('div');d.className='dc';
    d.innerHTML=`<div class="cn">${c.pk?'🔑 ':''}${c.fk?'🔗 ':''}<b>${c.n}</b></div><div class="ct">${c.t}${c.pk?' · PK':''}${c.fk?' · FK → '+c.fk:''}</div>`;
    dc.appendChild(d);
  });
  document.getElementById('dp').style.display='block';
}
function closeDP(){document.getElementById('dp').style.display='none';}
function filterTables(q){q=q.toLowerCase();document.querySelectorAll('.tn').forEach(n=>{n.style.display=(!q||n.dataset.t.toLowerCase().includes(q))?'':'none';});}
function filterSection(v){document.querySelectorAll('.tn').forEach(n=>{const t=T.find(x=>x.n===n.dataset.t);n.style.display=(!v||String(t.s)===v)?'':'none';});}
function toggleRels(){showR=!showR;document.getElementById('rb').textContent=showR?'Hide Relations':'Show Relations';drawRels(sel);}
function updateMM(){
  const c=document.getElementById('mc'),ctx=c.getContext('2d');
  ctx.clearRect(0,0,150,90);
  const bnd={minX:Infinity,minY:Infinity,maxX:-Infinity,maxY:-Infinity};
  T.forEach(t=>{const p=pos[t.n];bnd.minX=Math.min(bnd.minX,p.x);bnd.minY=Math.min(bnd.minY,p.y);bnd.maxX=Math.max(bnd.maxX,p.x+230);bnd.maxY=Math.max(bnd.maxY,p.y+180);});
  const ms=Math.min(148/(bnd.maxX-bnd.minX),88/(bnd.maxY-bnd.minY));
  const cols=['#1e3a5f','#2d1e5f','#1e4a3a','#3a2a1e','#1e2a4a','#3a1e2a','#2a3a1e','#3a3a1e','#1e3a3a','#2a1e3a'];
  T.forEach(t=>{const p=pos[t.n];ctx.fillStyle=cols[t.s];ctx.fillRect((p.x-bnd.minX)*ms+1,(p.y-bnd.minY)*ms+1,14,7);});
  const vx=(-tx/sc-bnd.minX)*ms,vy=(-ty/sc-bnd.minY)*ms;
  const vw=(cw.offsetWidth/sc)*ms,vh=(cw.offsetHeight/sc)*ms;
  ctx.strokeStyle='#7c8cf8';ctx.lineWidth=1;ctx.strokeRect(vx,vy,vw,vh);
}
setTimeout(()=>{applyT();},100);
window.addEventListener('resize',applyT);
</script>
</body>
